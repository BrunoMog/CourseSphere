name: AppSec & SRE CI Pipeline

on:
  push:
    branches: [ main, "fix/*" ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  security-and-tests:
    name: Security Auditing (SAST / SCA) & Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code (Pinned by Commit SHA for Supply Chain Security)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python (Pinned by Commit SHA)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov bandit pip-audit semgrep

      - name: Run Automated Security & Regression Tests
        run: |
          pytest backend/tests/ -v --junitxml=test-results.xml

      - name: Static Application Security Testing (Bandit SAST)
        run: |
          bandit -r backend/ --exclude backend/tests -ll -ii

      - name: Software Composition Analysis (pip-audit SCA)
        run: |
          pip-audit -r backend/requirements.txt

      - name: Semgrep SAST Scan
        run: |
          semgrep scan --config=auto --error .
