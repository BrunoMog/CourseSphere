name: AppSec & SRE CI Pipeline

on:
  push:
    branches: [ main, "fix/*" ]
  pull_request:
    branches: [ main ]

jobs:
  security-and-tests:
    name: Security Auditing (SAST / SCA) & Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov bandit pip-audit

      - name: Run Automated Security & Regression Tests
        run: |
          pytest backend/tests/ -v --junitxml=test-results.xml

      - name: Static Application Security Testing (Bandit SAST)
        run: |
          bandit -r backend/ -ll -ii

      - name: Software Composition Analysis (pip-audit SCA)
        run: |
          pip-audit -r backend/requirements.txt --ignore-vuln CVE-XXXX

      - name: Semgrep SAST Scan
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/secrets
            p/owasp-top-ten
        continue-on-error: true
