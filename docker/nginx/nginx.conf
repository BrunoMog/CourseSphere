events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # SRE: Structured upstream access logging format
    log_format loadbalanced '$remote_addr - $remote_user [$time_local] "$request" '
                            'status=$status upstream=$upstream_addr '
                            'upstream_status=$upstream_status '
                            'request_time=$request_time upstream_response_time=$upstream_response_time';

    access_log /var/log/nginx/access.log loadbalanced;
    error_log /var/log/nginx/error.log warn;

    # Gzip settings
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    # Upstream pool of backend instances (Round-robin balancing)
    upstream backend_cluster {
        server backend-1:5000 max_fails=3 fail_timeout=10s;
        server backend-2:5000 max_fails=3 fail_timeout=10s;
    }

    # Upstream for Frontend SPA
    upstream frontend_service {
        server frontend:80;
    }

    server {
        listen 80;
        server_name localhost;

        # Hardening: Security Headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Load-Balancer "CourseSphere-Nginx-Gateway" always;
        add_header X-Upstream-Backend $upstream_addr always;

        # Backend Health & Metrics Routes
        location ~ ^/(health|metrics) {
            proxy_pass http://backend_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
        }

        # Backend API Routes
        location ~ ^/(courses|users|chats|hash) {
            proxy_pass http://backend_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 15s;
        }

        # Frontend SPA Route
        location / {
            proxy_pass http://frontend_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
